name: Check

on:
  push:
    branches-ignore:
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, windows-2025, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.1
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24.8.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Test Go packages
        run: go test ./...
      - name: Vet Go packages
        run: go vet ./...
      - name: Generate Wails bindings
        run: wails generate module
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Check Go formatting
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l app cmd internal main.go)"
      - name: Check release shell syntax
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n scripts/package-runtime.sh scripts/toolchain/*.sh scripts/release/*.sh
